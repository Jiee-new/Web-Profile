  <text x="966" y="390" font-family="DejaVu Sans, sans-serif" font-size="230" font-weight="700" fill="#ffffff" text-anchor="middle">D</text>
  <text x="966" y="438" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#dbeafe" text-anchor="middle" letter-spacing="2.2">BUILD · SHIP · LEARN</text>

