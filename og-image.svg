  <text x="80" y="420" font-family="DejaVu Sans, sans-serif" font-size="34" fill="#cbd5e1">Web &amp; Android Developer</text>

  <!-- tech chips -->
  <g font-family="DejaVu Sans, sans-serif" font-size="21" fill="#cbd5e1">
    <rect x="80" y="466" width="136" height="50" rx="12" fill="#0f172a" stroke="#334155"/>
    <text x="102" y="498">Next.js</text>

    <rect x="232" y="466" width="110" height="50" rx="12" fill="#0f172a" stroke="#334155"/>
    <text x="254" y="498">React</text>

    <rect x="358" y="466" width="97" height="50" rx="12" fill="#0f172a" stroke="#334155"/>
    <text x="380" y="498">Java</text>

    <rect x="471" y="466" width="202" height="50" rx="12" fill="#0f172a" stroke="#334155"/>
