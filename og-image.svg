    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#64748b" stroke-opacity="0.14" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="930" cy="120" r="330" fill="url(#glow)"/>
  <circle cx="110" cy="600" r="240" fill="url(#glow)" opacity="0.5"/>

  <!-- badge -->
  <rect x="80" y="86" width="322" height="50" rx="25" fill="#0b1220" stroke="#2563eb" stroke-opacity="0.6"/>
  <circle cx="108" cy="111" r="5" fill="#34d399"/>
  <text x="126" y="119" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" letter-spacing="2.5" fill="#93c5fd">PORTOFOLIO · 2026</text>

